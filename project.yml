name: TVCompanionKit

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0

targets:
  TVCompanionPad:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iPad
    info:
      path: iPad/Info.plist
      properties:
        CFBundleDisplayName: TV Companion
        NSApplicationServices:
          Advertises:
            - NSApplicationServiceIdentifier: TVCompanionKit-Demo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.supercomputerstudios.TVCompanionKitDemo
        PRODUCT_NAME: TVCompanionPad
        PRODUCT_MODULE_NAME: TVCompanionPad
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      gatherCoverageData: false
      testTargets:
        - TVCompanionKitTests

  TVCompanionTV:
    type: application
    platform: tvOS
    sources:
      - path: Shared
      - path: TV
    info:
      path: TV/Info.plist
      properties:
        CFBundleDisplayName: TV Companion
        NSApplicationServices:
          Browses:
            - NSApplicationServiceIdentifier: TVCompanionKit-Demo
              NSApplicationServiceUsageDescription: Connect an iPad as a private session console for this TV experience.
              NSApplicationServicePlatformSupport:
                - iOS
                - iPadOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.supercomputerstudios.TVCompanionKitDemo
        PRODUCT_NAME: TVCompanionTV
        TARGETED_DEVICE_FAMILY: "3"
    scheme:
      gatherCoverageData: false

  TVCompanionKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared/CompanionProtocol.swift
      - path: Shared/MessageFraming.swift
      - path: Shared/PresentationReducer.swift
    info:
      path: Tests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.supercomputerstudios.TVCompanionKitTests
